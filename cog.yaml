build:
  gpu: true
  cuda: "12.1"
  system_packages:
    - ffmpeg
    - libgl1
    - libglib2.0-0
    - unzip
  python_version: "3.10.13"
  python_requirements: requirements.txt
  run:
    - curl -L -o /usr/local/bin/pget "https://github.com/replicate/pget/releases/download/v0.10.2/pget_linux_x86_64" && chmod +x /usr/local/bin/pget
    - mkdir -p checkpoints/whisper checkpoints/auxiliary/models
    - pget "https://huggingface.co/ByteDance/LatentSync-1.5/resolve/main/latentsync_unet.pt" checkpoints/latentsync_unet.pt
    - pget "https://huggingface.co/ByteDance/LatentSync-1.5/resolve/main/latentsync_syncnet.pt" checkpoints/latentsync_syncnet.pt
    - pget "https://huggingface.co/ByteDance/LatentSync-1.5/resolve/main/config.json" checkpoints/config.json
    - pget "https://huggingface.co/ByteDance/LatentSync-1.5/resolve/main/whisper/tiny.pt" checkpoints/whisper/tiny.pt
    - pget "https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip" /tmp/buffalo_l.zip
    - unzip -o /tmp/buffalo_l.zip -d checkpoints/auxiliary/models

predict: "predict.py:Predictor"
